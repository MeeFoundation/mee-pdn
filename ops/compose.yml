# The demo's seven nodes: three people, and a device per identity rather than
# per person — Alice keeps a laptop for work and another for leisure, which
# is what makes a device's belonging visible.
#
# One network, and nothing published from this file. A demo driven from the
# daemon's own host adds ops/compose.ports.yml and reaches the nodes over
# the published ports; a demo driven from another container on that daemon
# reaches them on this network instead, which is the only address such a
# caller has. Between the nodes nothing changes either way: everything runs
# over the runtimes' own protocols on this network.
#
# Each node keeps its state on a named volume of its own, mounted over the
# image's state directory (the image's PDN_DATA_DIR already points there) —
# a stopped node started again mid-show is the same node. The demo recipe
# removes the volumes with the containers on every exit, so a run still
# never meets the previous run's state.

name: pdn-demo

x-node: &node
  # The image by the content id the recipe resolved after building it, so
  # every node of one show comes from one artifact even if another build
  # moves the tag meanwhile. Brought up by hand, this is the tag itself.
  image: ${PDN_STAND_IMAGE:-pdn-node-http:dev}
  environment:
    PDN_DEBUG: "1"
    RUST_LOG: "info,pdn_node=debug,data_layer=debug"
  networks: [demo]

services:
  alice-phone:
    <<: *node
    volumes: ["alice-phone-state:/var/lib/pdn"]
  alice-work-laptop:
    <<: *node
    volumes: ["alice-work-laptop-state:/var/lib/pdn"]
  alice-leisure-laptop:
    <<: *node
    volumes: ["alice-leisure-laptop-state:/var/lib/pdn"]
  bob-phone:
    <<: *node
    volumes: ["bob-phone-state:/var/lib/pdn"]
  bob-laptop:
    <<: *node
    volumes: ["bob-laptop-state:/var/lib/pdn"]
  carol-phone:
    <<: *node
    volumes: ["carol-phone-state:/var/lib/pdn"]
  carol-laptop:
    <<: *node
    volumes: ["carol-laptop-state:/var/lib/pdn"]

networks:
  demo:

volumes:
  alice-phone-state:
  alice-work-laptop-state:
  alice-leisure-laptop-state:
  bob-phone-state:
  bob-laptop-state:
  carol-phone-state:
  carol-laptop-state:

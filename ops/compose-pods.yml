# The pods demo's six nodes: four people, Alice and Bob with a phone and a
# laptop each, Carol and Dave with a phone — enough for a pod to outlive its
# creator's devices going offline while its other members carry on.
#
# One network: between the nodes everything runs over the runtimes' own
# protocols on it. The HTTP surface of each node is published on loopback,
# where the narration drives it. Loopback because the debug surface is
# unauthenticated and mints live ceremony secrets, so a wider bind is never
# the default.
#
# Each node keeps its state on a named volume of its own, mounted over the
# image's state directory (the image's PDN_DATA_DIR already points there) —
# a stopped node started again mid-show is the same node. The demo recipe
# removes the volumes with the containers on every exit, so a run never
# meets the previous run's state.

name: pdn-demo-pods

x-node: &node
  # The image by the content id the recipe resolved after building it, so
  # every node of one show comes from one artifact even if another build
  # moves the tag meanwhile. Brought up by hand, this is the tag itself.
  image: ${PDN_STAND_IMAGE:-pdn-node-http:dev}
  environment:
    PDN_DEBUG: "1"
    RUST_LOG: "info,pdn_node=debug,data_layer=debug"
  networks: [demo]

services:
  alice-phone:
    <<: *node
    ports: ["127.0.0.1:3021:3011"]
    volumes: ["alice-phone-state:/var/lib/pdn"]
  alice-laptop:
    <<: *node
    ports: ["127.0.0.1:3022:3011"]
    volumes: ["alice-laptop-state:/var/lib/pdn"]
  bob-phone:
    <<: *node
    ports: ["127.0.0.1:3023:3011"]
    volumes: ["bob-phone-state:/var/lib/pdn"]
  bob-laptop:
    <<: *node
    ports: ["127.0.0.1:3024:3011"]
    volumes: ["bob-laptop-state:/var/lib/pdn"]
  carol-phone:
    <<: *node
    ports: ["127.0.0.1:3025:3011"]
    volumes: ["carol-phone-state:/var/lib/pdn"]
  dave-phone:
    <<: *node
    ports: ["127.0.0.1:3026:3011"]
    volumes: ["dave-phone-state:/var/lib/pdn"]

networks:
  demo:

volumes:
  alice-phone-state:
  alice-laptop-state:
  bob-phone-state:
  bob-laptop-state:
  carol-phone-state:
  dave-phone-state:

[package]
name = "pdn-mobile"
version = "0.1.0"
edition = "2021"
description = "uniffi facade over the pdn-node runtime: the host an iOS or Android application embeds"

[lib]
# `cdylib` is what an Android application loads and what the binding
# generator reads its metadata out of, `lib` what this crate's own tests
# drive. The static library an iOS application links is asked for by the
# build recipe (`cargo rustc --crate-type staticlib`) rather than listed
# here: it archives the whole graph, so a debug build of the workspace
# would materialise gigabytes nothing on a development machine links.
crate-type = ["lib", "cdylib"]
name = "pdn_mobile"

[features]
# The binding generator, needed by `pdn-sdk`'s packaging recipes and by
# nothing a device installs. Behind a feature so the product build carries
# neither the generator nor its argument parser.
cli = ["uniffi/cli", "uniffi/cargo-metadata"]
# The sync tests' test build (`pdn-sdk`'s test artifact, never a release):
# the laptop host's debug and observation routes on the phone's loopback.
observation = [
  "pdn-node/test-util",
  "dep:pdn-node-http",
  "pdn-node-http/observation",
  "dep:axum",
  "dep:tower",
  "tokio/net",
  "tokio/time",
]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["json"], optional = true }
# The textual form of a ceremony payload: the runtime type's own serde bytes
# in an alphabet a code renders and a scan recovers.
base64 = "0.22"
pdn-node = { path = "../pdn-node" }
# Only the test build links the laptop host, for its router: what ships keeps
# its host dependency pointing toward the runtime alone.
pdn-node-http = { path = "../pdn-node-http", optional = true }
serde = "1"
serde_json = "1"
thiserror = "2"
# The facade owns the asynchronous runtime the operations need; a foreign
# caller brings none.
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
tower = { version = "0.5", features = ["util"], optional = true }
tracing = { workspace = true }
# The unrecognized failure carries no cause across the binding boundary: the
# cause chain stays in the log, which is nothing at all on a phone unless
# something routes it to the platform's own.
tracing-subscriber = "0.3"
uniffi = { version = "0.32", default-features = false }

[dev-dependencies]
# The test surface's tests speak HTTP to it as a coordinator does.
reqwest = { version = "0.12", default-features = false }
tempfile = "3"
# The surface tests assert a payload minted here parses as the encoding the
# other host over the same runtime takes, which is the runtime type's own.
serde_json = "1"
test-utils = { path = "../test-utils" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true

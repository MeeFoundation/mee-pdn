[package]
name = "pdn-node-http"
version = "0.1.0"
edition = "2021"
publish = false
description = "Thin HTTP host for the demo stand, embedding one pdn-node runtime"

[features]
# The observation routes over the runtime's test-only calls: the sync tests'
# laptop node, never the stand's image or a product build.
observation = ["pdn-node/test-util", "dep:futures-lite"]

[dependencies]
anyhow = "1"
futures-lite = { version = "2", optional = true }
# `json` for the structured response bodies; record payloads travel raw.
axum = { version = "0.8", features = ["json"] }
pdn-node = { path = "../pdn-node" }
serde = { version = "1", features = ["derive"] }
# Request bodies are decoded here rather than by axum's `Json` extractor, so
# a malformed body lands on the error table's 400 instead of axum's 422.
serde_json = "1"
serde_urlencoded = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
tracing = { workspace = true }
tracing-subscriber = "0.3"
# The log's writer thread: a slow standard output never stalls a runtime worker.
tracing-appender = "0.2"

[dev-dependencies]
pdn-node = { path = "../pdn-node", features = ["test-util"] }
# The stand's transport: a client over a container's published port, plain
# HTTP to loopback. iroh turns on this reqwest's `rustls-no-provider`, so the
# client takes a TLS configuration of its own: `plain_http_tls` (iroh-002).
reqwest = { version = "0.13", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
testcontainers = "0.28"
# The storage directory of `tests/log_writer.rs`'s host process.
tempfile = "3"
# `io-util` for the stand's log follower, which re-attaches a container's
# log capture after a restart; the crate's own build needs no reader.
tokio = { version = "1", features = ["io-util"] }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true

[package]
name = "pdn-node-http"
version = "0.1.0"
edition = "2021"
description = "Thin HTTP host for the demo stand, embedding one pdn-node runtime"

[dependencies]
anyhow = "1"
# `json` for the structured response bodies; entry payloads travel raw.
axum = { version = "0.8", features = ["json"] }
pdn-node = { path = "../pdn-node" }
serde = { version = "1", features = ["derive"] }
# Request bodies are decoded here rather than by axum's `Json` extractor, so
# a malformed body lands on the error table's 400 instead of axum's 422.
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tracing = { workspace = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true

[package]
name = "pdn-store"
version = "0.1.0"
edition = "2021"
description = "PDN's iroh-docs variant: document sync whose every session the embedder judges"
license = "MIT/Apache-2.0"
authors = ["n0 team"]
repository = "https://github.com/MeeFoundation/mee-pdn"
rust-version = "1.91"
# The platform's own variant of n0's `iroh-docs` (ADR-0016): never on crates.io.
publish = false

[features]
# The ordered subscription and the session id a load test observes a pod's
# sync by; never the product. `data-layer/test-util` turns it on.
observation = []

[dependencies]
anyhow = "1"
async-channel = "2.3.1"
blake3 = "1.8"
bytes = { version = "1.7", features = ["serde"] }
derive_more = { version = "2.0.1", features = [
    "debug",
    "deref",
    "display",
    "from",
    "from_str",
    "try_into",
    "into",
    "as_ref",
] }
hex = "0.4"
iroh = { version = "1", default-features = false }
iroh-tickets = { version = "1" }
iroh-blobs = { version = "0.103", default-features = false, features = ["fs-store"] }
iroh-gossip = { version = "0.101.0", features = ["net"], default-features = false }
iroh-metrics = { version = "1", default-features = false, features = ["metrics"] }
irpc = { version = "0.17", default-features = false }
n0-error = "1"
n0-future = { version = "0.3.1", features = ["serde"] }
num_enum = "0.7"
postcard = { version = "1", default-features = false, features = [
    "alloc",
    "use-std",
    "experimental-derive",
] }
rand = "0.10"
redb = { version = "4.1" }
self_cell = "1.0.3"
serde = { version = "1.0.164", features = ["derive"] }
strum = { version = "0.28", features = ["derive"] }
tempfile = { version = "3.4" }
thiserror = "2"
# rt-multi-thread: iroh-blobs-002.
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "time", "io-util"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7.12", features = ["codec", "io-util", "io", "rt"] }
tracing = "0.1"

[dev-dependencies]
data-encoding = "2.6.0"
futures-buffered = "0.2.4"
iroh = { version = "1", features = ["test-utils"] }
nested_enum_utils = "0.2"
parking_lot = "0.12.3"
proptest = "1.2.0"
rand = { version = "0.10", features = ["chacha"] }
# The cache statistics a test reads to see the bound reach the database.
redb = { version = "4.1", features = ["cache_metrics"] }
tempfile = "3.4"
test-strategy = "0.4"
testdir = "0.10"
testresult = "0.4.1"
tokio = { version = "1", features = ["sync", "macros"] }
tracing-test = "0.2.5"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

[lints.rust]
missing_debug_implementations = "warn"

[[test]]
name = "observe"
required-features = ["observation"]

[package]
name = "data-layer"
version = "0.1.0"
edition = "2021"
description = "Data layer: capability-gated document sync over our iroh-docs variant"

[features]
# Extra observation surface for scenario tests, never the product:
# `SyncNode::namespace_contacts`, the read side of the tracked contact set,
# so a scenario can assert what the sweep derived instead of sleeping and
# guessing. Off in every product build; `pdn-node/test-util` turns it on.
test-util = []

[dependencies]
anyhow = "1"
blake3 = "1.8"
futures-core = "0.3"
futures-lite = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
iroh = { workspace = true }
iroh-blobs = { workspace = true }
iroh-gossip = { workspace = true }
pdn-store = { workspace = true }
pdn-types = { path = "../pdn-types" }
# The same major the fork's replica store uses, for one downcast: telling
# "the directory is held by another running node" apart from corruption
# when a spawn's store open fails (`DirectoryHeld`).
redb = "4.1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time"] }
tracing = { workspace = true }

[dev-dependencies]
# Scenario tests of directory-configured nodes get a directory each.
tempfile = "3"
test-utils = { path = "../test-utils" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true

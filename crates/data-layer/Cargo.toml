[package]
name = "data-layer"
version = "0.1.0"
edition = "2021"
publish = false
description = "Data layer: document sync over our iroh-docs variant, every session judged by its access book"

[features]
# Extra observation surface for scenario tests, never the product: the read
# side of the tracked contact set, the session and pass counters, a pod's
# exchanges in flight, and the session opened under a named holder, so a
# scenario can assert what the
# node derived instead of sleeping and guessing. The node in memory too,
# which keeps nothing across a restart. Off in every product
# build; `pdn-node/test-util` turns it on, and `just test -p data-layer`
# names it directly.
test-util = []

[dependencies]
anyhow = "1"
blake3 = "1.8"
futures-core = "0.3"
futures-lite = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The path selector hook: iroh's own selector keeps a dead path to a peer
# that restarted at a new address (src/path_selector.rs).
iroh = { workspace = true, features = ["unstable-custom-transports"] }
iroh-blobs = { workspace = true }
iroh-gossip = { workspace = true }
pdn-store = { workspace = true }
pdn-types = { path = "../pdn-types" }
# The pod stores' pass draws the peers each run reaches.
rand = "0.10"
# The same major the fork's replica store uses, for one downcast: telling
# "the directory is held by another running node" apart from corruption
# when a spawn's store open fails (`DirectoryHeld`).
redb = "4.1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time"] }
# The blob protocol's stream tasks, tracked so a stop waits for them before
# it closes the blob store.
tokio-util = { version = "0.7", features = ["rt"] }
tracing = { workspace = true }

[dev-dependencies]
# Scenario tests of directory-configured nodes get a directory each.
tempfile = "3"
test-utils = { path = "../test-utils", features = ["test-util"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true

[package]
name = "graph-query-engine"
version = "0.1.0"
edition = "2021"
description = "The graph query engine: the only way to the graph database, and search by meaning beside it"
license = "MIT OR Apache-2.0"
publish = false

[features]
# Fault hooks for the crate's own tests: a bulk load made to fail at a named
# table. Off in every product build; the crate's tests turn it on through
# their dev-dependency on the crate itself.
test-util = []

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
uuid = { version = "1", features = ["v4"] }
futures = "0.3"
tracing = { workspace = true }
# LadybugDB, the graph database. This crate alone depends on it. 0.22.1, the
# first with its vector extension buildable into the engine for Android.
# Built from source (the workspace's .cargo/config.toml): needs cmake and OpenSSL 3.
lbug = "=0.22.1"

[dev-dependencies]
graph-query-engine = { path = ".", features = ["test-util"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true

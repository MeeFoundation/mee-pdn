# A test still running after ten minutes is killed and counted as failed.
# The slowest honest test takes about a minute on a loaded runner; a hang
# would otherwise hold a whole run to its job's limit and pass in the end.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 10 }

# One node of the stand is a container, and one test starts up to four of
# them. Left to the default, the runner schedules a test per core of *this*
# machine, which is not always the machine the daemon runs on — a daemon on a
# virtual machine reports its own share rather than the host's cores. So the
# bound comes from what the daemon says about itself: `just test-docker` reads
# its CPU count and picks the matching profile below.
#
# The rungs are a ladder rather than an expression because the runner reads
# this file before any code of ours runs, and its group bound takes a number,
# not a computation. A caller that names no profile gets `stand-2`, which is
# safe on any daemon; the recipe names a wider rung when the daemon has the
# cores to back it.
[test-groups]
stand-1 = { max-threads = 1 }
stand-2 = { max-threads = 2 }
stand-4 = { max-threads = 4 }
stand-8 = { max-threads = 8 }
stand-16 = { max-threads = 16 }

[[profile.default.overrides]]
filter = 'binary(~stand)'
test-group = 'stand-2'

[profile.cap-1]
[[profile.cap-1.overrides]]
filter = 'binary(~stand)'
test-group = 'stand-1'

[profile.cap-2]
[[profile.cap-2.overrides]]
filter = 'binary(~stand)'
test-group = 'stand-2'

[profile.cap-4]
[[profile.cap-4.overrides]]
filter = 'binary(~stand)'
test-group = 'stand-4'

[profile.cap-8]
[[profile.cap-8.overrides]]
filter = 'binary(~stand)'
test-group = 'stand-8'

[profile.cap-16]
[[profile.cap-16.overrides]]
filter = 'binary(~stand)'
test-group = 'stand-16'

# On GitHub's runner these tests take from half a minute to four, the rest
# seconds; queued last, the longest ran alone at the end of every iteration.
[[profile.default.overrides]]
filter = '''
    test(=a_ten_thousand_entry_session_drained_at_conversion_pace_loses_nothing)
  | test(=a_killed_member_restarted_at_a_new_address_is_reached_there)
  | test(=two_nodes_sharing_sixty_pods_keep_live_delivery_in_each)
  | test(=a_catch_up_past_the_events_channel_finishes_while_the_live_actor_asks_the_sync_actor)
  | test(=a_dial_toward_a_neighbor_it_cannot_reach_is_tried_again)
'''
priority = 100

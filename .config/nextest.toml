# One node of the stand is a container, and one test starts up to four of
# them. Left to the default, the runner schedules a test per core of *this*
# machine, which is not the machine the daemon runs on — a suite run inside a
# development container talks to the host's daemon, and a daemon on a virtual
# machine reports its own share rather than the host's cores. So the bound
# comes from what the daemon says about itself: `just test-docker` reads its
# CPU count and picks the matching profile below.
#
# The rungs are a ladder rather than an expression because the runner reads
# this file before any code of ours runs, and its group bound takes a number,
# not a computation. A caller that names no profile gets `stand-2`, which is
# safe on any daemon; the recipe names a wider rung when the daemon has the
# cores to back it.
#
# Measured on a daemon holding 8 CPUs, over 15 tests in 4 binaries: 1 slot
# takes 56 seconds, 2 takes 29, 4 takes 16, 8 takes 13. The floor is the
# suite's longest single test, about 12 seconds, which 8 nearly reaches and
# 4 does not — so on a daemon this size every rung up to 8 still buys time,
# and the rung the daemon's size selects is the one that matters. No
# container missed its readiness budget at any rung: the replacement log
# stayed empty across all four runs. The figures follow the suite's size and
# shape, so a growth worth noticing is worth measuring.
[test-groups]
stand-1 = { max-threads = 1 }
stand-2 = { max-threads = 2 }
stand-4 = { max-threads = 4 }
stand-8 = { max-threads = 8 }
stand-16 = { max-threads = 16 }

[[profile.default.overrides]]
filter = 'binary(~stand)'
test-group = 'stand-2'

[profile.cap-1]
[[profile.cap-1.overrides]]
filter = 'binary(~stand)'
test-group = 'stand-1'

[profile.cap-2]
[[profile.cap-2.overrides]]
filter = 'binary(~stand)'
test-group = 'stand-2'

[profile.cap-4]
[[profile.cap-4.overrides]]
filter = 'binary(~stand)'
test-group = 'stand-4'

[profile.cap-8]
[[profile.cap-8.overrides]]
filter = 'binary(~stand)'
test-group = 'stand-8'

[profile.cap-16]
[[profile.cap-16.overrides]]
filter = 'binary(~stand)'
test-group = 'stand-16'

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

# The image build is the expensive step, and a series of pushes would run
# several of them side by side for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repository; the container job additionally
# reaches a layer cache, which needs no repository scope of its own.
permissions:
  contents: read

jobs:
  lint-test-wasm:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Channel, components and targets from rust-toolchain.toml, in every job.
      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Install just + nextest
        uses: ./.github/actions/install-tools
        with:
          tools: just cargo-nextest

      - name: Cache cargo/target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target

      - name: Lint & type-check
        run: just check

      - name: Run tests
        run: just test

  # The store under its other feature sets and on the wasm32 target — the
  # configurations the workspace build never compiles, so a break in them is
  # invisible to the job above. Its own job, so its two extra builds of the
  # iroh stack run beside the workspace's rather than after it.
  store:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Install just + nextest
        uses: ./.github/actions/install-tools
        with:
          tools: just cargo-nextest

      - name: Cache cargo/target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target

      - name: Lint the store's other feature sets, docs, and wasm build
        run: just check-store

      - name: Test the store's other feature sets and doctests
        run: just test-store

  stand:
    runs-on: ubuntu-26.04
    # A release image build plus the container suite. Past this the job is
    # stuck rather than slow, and the runner's own ceiling is six hours.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Install just + nextest
        uses: ./.github/actions/install-tools
        with:
          tools: just cargo-nextest

      - name: Cache cargo/target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target

      - name: Set up buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The image the scenarios look for, built with a layer cache so a run
      # pays for the dependency stage once. Built here rather than through
      # `just test-docker`, which builds without that cache.
      - name: Build the stand's image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ops/Dockerfile
          tags: pdn-node-http:dev
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Both of the run's own inputs come from recipes the local run uses too,
      # so the two cannot drift apart: the parallelism bound from the daemon
      # on this runner rather than a number baked in for a development
      # machine, and the image by the content id of what the step above built
      # rather than by the tag that also names it.
      - name: Run the container scenarios
        run: |
          PDN_STAND_IMAGE="$(just stand-image)"
          [ -n "$PDN_STAND_IMAGE" ] || { echo "the image built, but the daemon does not name it"; exit 1; }
          export PDN_STAND_IMAGE
          cargo nextest run --profile "$(just stand-profile)" -p pdn-node-http -E 'binary(~stand)' --run-ignored all

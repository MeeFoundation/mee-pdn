name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

jobs:
  lint-test-wasm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install just + nextest
        uses: taiki-e/install-action@v2
        with:
          tool: just,nextest

      - name: Cache cargo/target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Add wasm targets
        run: |
          rustup target add wasm32-wasip1 wasm32-unknown-unknown

      - name: Lint & type-check
        run: just check

      - name: Run tests
        run: just test

  stand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install just + nextest
        uses: taiki-e/install-action@v2
        with:
          tool: just,nextest

      - name: Cache cargo/target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      # The image the scenarios look for, built with a layer cache so a run
      # pays for the dependency stage once. Built here rather than through
      # `just test-docker`, which builds without that cache.
      - name: Build the stand's image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ops/Dockerfile
          tags: pdn-node-http:dev
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The parallelism bound comes from the daemon on this runner, not from
      # the number baked in for a development machine — same recipe the local
      # run uses, so the two cannot drift apart.
      - name: Run the container scenarios
        run: cargo nextest run --profile "$(just stand-profile)" -p pdn-node-http -E 'binary(~stand)' --run-ignored all

# deny.toml's policy over the dependency tree, run when a change touches the
# tree itself. The nightly dependency-audit job covers the other direction —
# the advisory database moving while the tree stands still — so a new
# advisory reddens the night, not an unrelated pull request. Its own
# workflow rather than a job in ci.yml: a paths filter is a trigger of the
# whole workflow, not of one job.
name: dependency-audit

on:
  pull_request:
    branches: ["**"]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/*/Cargo.toml"
      - "deny.toml"
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/*/Cargo.toml"
      - "deny.toml"

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cargo-deny
        uses: ./.github/actions/install-tools
        with:
          tools: cargo-deny

      - name: Check the tree against deny.toml
        run: cargo deny check

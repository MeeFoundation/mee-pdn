# The flaky hunt, run without anyone deciding to look: one job per suite —
# the Docker tests' and the in-process tests'. Beside the hunt, the
# dependency audit — deny.toml's policy over the tree, rechecked nightly
# because the advisory database moves while the repository stands still.
#
# Both cost seconds per test and pass on any given run; the failures worth
# finding here show up once in tens or hundreds of them, which no pull
# request can afford and no person remembers to do. So each suite is repeated
# nightly, and a night that catches something in the Docker tests keeps the nodes'
# logs as an artifact — the assertion says a value never arrived, and only
# those logs say what the node was doing instead.
name: Nightly

on:
  schedule:
    # Every day at 23:17 UTC; GitHub starts it when it sees fit, at times 12
    # hours later.
    - cron: "17 23 * * *"
  workflow_dispatch:
    inputs:
      iterations:
        description: "How many times to repeat the Docker tests"
        default: "100"
      scenario_iterations:
        description: "How many times to repeat the in-process tests"
        default: "15"

jobs:
  # deny.toml's policy over the dependency tree, as every pull request runs
  # it: again nightly, since the advisory database moves while the tree
  # stands still. The hunts wait on it — a dependency that just received an
  # advisory is not compiled and run for hours on a runner first.
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cargo-deny
        uses: ./.github/actions/install-tools
        with:
          tools: cargo-deny

      - name: Check the tree against deny.toml
        run: cargo deny check

  # Every test of the HTTP surface is a container test, so this job needs the
  # daemon and builds the pdn-node-http image itself.
  docker-tests:
    name: Docker tests × ${{ inputs.iterations || '100' }}
    needs: dependency-audit
    runs-on: ubuntu-26.04
    # A hundred iterations of a suite whose own wall clock is seconds, plus
    # one image build from cold. Past this the job is stuck rather than slow.
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Install just + nextest
        uses: ./.github/actions/install-tools
        with:
          tools: just cargo-nextest

      - name: Cache cargo/target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: . -> target

      # The recipe builds the image itself, without the pull request job's
      # layer cache: a nightly can afford the cold build, and paying it here
      # keeps one command doing the same thing locally and in the pipeline.
      - name: Stress the Docker tests
        run: just stress-docker "${{ github.event.inputs.iterations || '100' }}"

      - name: Keep what the failure needs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stand-hunt
          path: target/tmp/stand-hunt-*
          if-no-files-found: ignore
          retention-days: 14

  # The in-process tests — no container, no daemon, no image. Hunted the
  # same way and in parallel with the Docker tests: they share nothing, and a
  # public repository's runners are free.
  in-process-tests:
    name: In-process tests × ${{ inputs.scenario_iterations || '15' }}
    needs: dependency-audit
    runs-on: ubuntu-26.04
    # One pass of the scenario tests is about two minutes on a development
    # machine and five to nine on a runner's four cores. The budget is what the
    # job is allowed to take, not what the hunt is worth.
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Install just + nextest
        uses: ./.github/actions/install-tools
        with:
          tools: just cargo-nextest

      - name: Cache cargo/target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: . -> target

      # `--no-fail-fast` for the reason the Docker tests' hunt has it: an early
      # failure must not cancel the remaining repeats, or one flake hides
      # how often it happens and whether anything else fails too. The
      # selection is the recipe's own default — the scenario tests, the
      # store's integration tests among them, with the Docker tests' binaries
      # skipped as they are everywhere else.
      - name: Stress the in-process tests
        run: just stress --stress-count "${{ github.event.inputs.scenario_iterations || '15' }}" --no-fail-fast

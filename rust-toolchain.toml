# Every consumer that runs rustup — a developer's machine, CI, the devcontainer —
# builds with this one toolchain; `just setup-tooling` installs it. The stand
# image (ops/Dockerfile) does not see this file and names its own base image.
[toolchain]
channel = "1.99.1"
profile = "minimal"
components = ["clippy", "rustfmt", "rust-src"]
targets = ["aarch64-apple-ios", "aarch64-apple-ios-sim", "aarch64-linux-android"]

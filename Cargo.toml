[workspace]
members = [
  "crates/pdn-types",     # platform primitives + the data vocabulary
  "crates/pdn-store",     # our iroh-docs variant: document sync whose sessions the embedder judges
  "crates/data-layer",    # document sync over our iroh-docs variant
  "crates/pdn-layer",     # platform surface: domain model + PdnOp AST
  "crates/pdn-node",      # embeddable node runtime: service glue over data-layer
  "crates/pdn-node-http", # thin HTTP host embedding one runtime
  "crates/pdn-mobile",    # uniffi facade: the host a phone embeds
  "crates/test-utils",    # shared scenario-test plumbing (dev-dependency only)
]
exclude = [
  # Nested checkouts carrying their own manifests — without this, cargo run from
  # inside them walks up, finds this workspace, and refuses to build.
  "mee-v1",
  "mee-v3-single-device",
]
resolver = "2"

[workspace.dependencies]
# The iroh stack is pinned here so every consumer agrees. A bump of any of the
# three owes the pass of crates/pdn-store/UPSTREAM.md (ADR-0016).
iroh = "1.4.1"
iroh-blobs = "0.103"
iroh-gossip = "0.101"
tracing = "0.1"
# `pdn-store` is our iroh-docs variant, every session judged by the embedder.
pdn-store = { path = "crates/pdn-store" }

[patch.crates-io]
# Each patch answers the iroh defects it names, listed with their state
# upstream in mia-docs' components/mee-pdn/iroh-defects.md.
# iroh-blobs-001, iroh-blobs-002: upstream's main, fixed and unreleased, at
# the commit before #298 (iroh-blobs-009). It takes iroh-util 0.7.0, the
# release with the fix of iroh-util-001.
iroh-blobs = { git = "https://github.com/n0-computer/iroh-blobs", rev = "3369597fa5d35804f1634d4a6be7c3ed3a7f05f6" }
# iroh-gossip-001: upstream's main, fixed and unreleased.
iroh-gossip = { git = "https://github.com/n0-computer/iroh-gossip", rev = "cf859543942b017d9e7034ecfa4aa61bfcf291e7" }

# Full debug info is copied into every test binary and build variant, and on
# macOS into object files beside them: tens of gigabytes of target/. Backtraces
# keep file and line in our crates and function names in dependencies.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

# No crate here is published: its docs are read in the source or in a build
# with private items, where a link from a public item to a private one works.
[workspace.lints.rustdoc]
private_intra_doc_links = "allow"

[workspace.lints.clippy]
# Groups
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Pedantic overrides — too noisy
module_name_repetitions = "allow"
must_use_candidate = "allow"

# --- Deny: clear-cut safety rules ---

# Don't panic
unwrap_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

# Don't break the type system
mem_forget = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

# Don't leave debug code
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

# Don't call process::exit
exit = "deny"

# Useless clones / string ops (`implicit_clone` subsumes `string_to_string`)
implicit_clone = "deny"

# --- Warn: soft rules ---

# Panic-adjacent
expect_used = "warn"
indexing_slicing = "warn"
unwrap_in_result = "warn"

# Type system
as_conversions = "warn"

# String discipline
str_to_string = "warn"

# Error docs — silenced: the public API is a draft
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# Misc
infinite_loop = "deny"
shadow_unrelated = "allow"
redundant_clone = "warn"
large_futures = "warn"
